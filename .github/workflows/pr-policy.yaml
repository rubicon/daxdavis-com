name: PR policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

# Trusted first-party automation (Dependabot, release-please) is exempt from the
# two human-oriented rules it structurally cannot satisfy: dev/<issue>-<slug>
# branch naming and issue linkage. Its branches are tool-owned and its bodies
# carry a dependency diff or a changelog, not an issue reference. Every other
# check still applies to it.
jobs:
  branch-name:
    name: Branch naming
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check head branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          ACTOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          case "$HEAD_REF" in
            dependabot/* | release-please--*)
              echo "Trusted automation branch ($HEAD_REF). Check passes." ; exit 0 ;;
          esac
          if [ "$ACTOR" = "dependabot[bot]" ] || [ "$ACTOR" = "rubicon-release-please[bot]" ]; then
            echo "Trusted automation actor ($ACTOR). Check passes." ; exit 0
          fi
          if printf '%s' "$HEAD_REF" | grep -Eq '^dev/[0-9]+-[a-z0-9.-]+$'; then
            echo "Branch '$HEAD_REF' matches dev/<issue-number>-<short-kebab-description>."
          else
            echo "::error::Branch '$HEAD_REF' must match dev/<issue-number>-<short-kebab-description>, for example dev/12-add-contact-page."
            exit 1
          fi

  issue-link:
    name: Issue linkage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check pull request body for a closing reference
        env:
          HEAD_REF: ${{ github.head_ref }}
          ACTOR: ${{ github.event.pull_request.user.login }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          case "$HEAD_REF" in
            dependabot/* | release-please--*)
              echo "Trusted automation branch ($HEAD_REF). Check passes." ; exit 0 ;;
          esac
          if [ "$ACTOR" = "dependabot[bot]" ] || [ "$ACTOR" = "rubicon-release-please[bot]" ]; then
            echo "Trusted automation actor ($ACTOR). Check passes." ; exit 0
          fi
          if printf '%s' "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+'; then
            echo "Pull request body links an issue."
          else
            echo "::error::Pull request body must close its issue, for example 'Closes #12'."
            exit 1
          fi
